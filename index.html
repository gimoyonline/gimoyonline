<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pribadi + Supabase</title>
    <!-- Memuat Supabase JS Client dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main style="max-width: 600px; margin: 40px auto; font-family: sans-serif; padding: 0 20px;">
        <h1>Catatan Harian</h1>
        
        <!-- Form untuk menambah data -->
        <form id="form-catatan">
            <input type="text" id="input-pesan" placeholder="Tulis catatan baru..." required style="padding: 8px; width: 70%;">
            <button type="submit" style="padding: 8px 16px;">Simpan</button>
        </form>

        <hr style="margin: 20px 0;">

        <h3>Daftar Catatan dari Supabase:</h3>
        <ul id="list-catatan">
            <li>Memuat data...</li>
        </ul>
    </main>

    <!-- Hubungkan script utama -->
    <script src="script.js"></script>
</body>
</html>
